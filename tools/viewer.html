<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VF4FT glTF Viewer</title>
<!-- Local viewer for tools/gltf.py output. Serve the repo root over HTTP
     (python3 -m http.server) and open tools/viewer.html?file=../work/gltf/<name>.glb -->
<style>
  :root { --bg: #1e1f22; --panel: #2b2d31; --ink: #e8e8ea; --muted: #a0a3a8; --accent: #6aa9ff; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px system-ui, sans-serif; }
  #bar { position: fixed; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
         padding: 8px 16px; background: var(--panel); z-index: 1; }
  #bar select, #bar input[type=range] { flex: 1 1 200px; min-width: 0; }
  #bar button, #bar select { background: var(--bg); color: var(--ink); border: 1px solid #444; border-radius: 4px; padding: 4px 8px; }
  #info { color: var(--muted); font-size: 12px; flex: 1 1 100%; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="bar">
  <select id="anim" aria-label="Animation"></select>
  <button id="play">Pause</button>
  <input id="frame" type="range" min="0" max="0" value="0" aria-label="Frame">
  <span id="fr">frame 0</span>
  <div id="info">loading…</div>
</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const file = new URLSearchParams(location.search).get("file");
const info = document.getElementById("info");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e1f22);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2.2));
const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(-2, 4, -3);
scene.add(sun);
scene.add(new THREE.GridHelper(6, 12, 0x555555, 0x333333));
const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.05, 200);
camera.position.set(0.6, 1.3, -3.6);  // characters face -z
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
controls.update();

let mixer, action, clip, playing = true, clips = [];
const sel = document.getElementById("anim"), slider = document.getElementById("frame"), frLabel = document.getElementById("fr");

function choose(i) {
  if (action) action.stop();
  clip = clips[i];
  action = mixer.clipAction(clip);
  action.play();
  action.paused = !playing;
  slider.max = Math.max(0, Math.round(clip.duration * 30));
}
sel.onchange = () => choose(+sel.value);
document.getElementById("play").onclick = (e) => {
  playing = !playing;
  if (action) action.paused = !playing;
  e.target.textContent = playing ? "Pause" : "Play";
};
slider.oninput = () => {
  if (!action) return;
  playing = false; action.paused = true;
  document.getElementById("play").textContent = "Play";
  action.time = slider.value / 30;
  mixer.update(0);
};

new GLTFLoader().load(file, (gltf) => {
  scene.add(gltf.scene);
  clips = gltf.animations;
  mixer = new THREE.AnimationMixer(gltf.scene);
  clips.forEach((c, i) => sel.add(new Option(`${c.name} (${Math.round(c.duration * 30) + 1} f)`, i)));
  let meshes = 0, skins = 0;
  // three.js computes a skinned mesh's bounding sphere once, in whatever
  // pose it first renders, and culls by it from then on; the poses move far
  // from that and the face switch scales a mesh to 0, so do not cull
  gltf.scene.traverse((o) => { if (o.isMesh) meshes++; if (o.isSkinnedMesh) { skins++; o.frustumCulled = false; } });
  info.textContent = `${file}: ${meshes} meshes (${skins} skinned), ${clips.length} animations`;
  window.vf4 = { gltf, mixer, clips, meshes, skins, camera, controls, choose };
  if (clips.length) choose(0);
}, undefined, (err) => { info.textContent = "load failed: " + err; console.error(err); });

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (mixer && playing) {
    mixer.update(dt);
    if (action) { const f = Math.round((action.time % clip.duration) * 30); slider.value = f; frLabel.textContent = `frame ${f}`; }
  } else if (action) frLabel.textContent = `frame ${slider.value}`;
  renderer.render(scene, camera);
});
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
